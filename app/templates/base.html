<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0f15">
    <meta name="description" content="PULSE ATLAS 演唱会数据分析与可视化系统">
    <title>{% block title %}PULSE ATLAS{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" data-page="{% block page_name %}base{% endblock %}">
    <div class="grain" aria-hidden="true"></div>
    <div class="flash-stack" aria-live="polite">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="toast toast-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
    </div>
    {% block body %}{% endblock %}
    <script src="{{ url_for('static', filename='vendor/echarts.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/lucide.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
